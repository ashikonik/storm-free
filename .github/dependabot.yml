version: 2

updates:
  # The project's own dependencies.  The versions here are the ones the
  # CI workflows pin, so a bump should be made there too.
  #
  # The upstream STORM requirements are *not* listed here: they live in
  # the gitignored `storm/` clone, which Dependabot cannot see.  They are
  # tracked instead by moving the pinned upstream commit, which is
  # described in README's "Upstream pin" section.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope

  # The actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      prefix-development: "ci-dev"
      include: scope
