[mypy]
python_version = 3.11
files = free_setup, run_storm_free.py

# The upstream STORM clone is imported by path, not installed as a package,
# so mypy cannot see its types.  The third-party libraries it depends on
# (toml, dspy) ship no stubs either.  Neither is worth a stub: the code is
# type-checked for internal consistency, which is what catches real bugs.
ignore_missing_imports = True

# ``dspy`` and the upstream package use untyped decorators and dynamic
# attributes that mypy cannot follow; complaining about them produces noise
# rather than signal.
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = False
warn_redundant_casts = True
no_implicit_optional = True
